[package]
name = "g4api"
version = "0.1.0"
edition = "2021"
description = "G4 api is a simple REST API for managing users and tasks"
license = "MIT"
authors = ["Laurent Sémat <gectou4@gmail.com>"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio", "mysql"] }
dotenvy = "0.15"
thiserror = "1"
tower-http = { version = "0.5", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1"
