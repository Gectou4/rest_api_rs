services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:root@db:3306/rest_api
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/user/1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rest_api
    ports:
      - "3306:3306"
    volumes:
      - ./share/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  test:
    image: alpine:latest
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      API_URL: http://api:3000
    volumes:
      - ./scripts/test.sh:/test.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache bash curl > /dev/null 2>&1 && bash /test.sh"]

volumes:
  db_data:
